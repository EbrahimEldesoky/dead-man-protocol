[package]
name = "dead-man-protocol"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"
rust-version = "1.75.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "dead_man_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[dependencies]
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"
blake3 = "=1.5.5"
indexmap = "=2.6.0"
unicode-segmentation = "=1.12.0"
proc-macro-crate = "=3.1.0"
toml_edit = "=0.21.1"
