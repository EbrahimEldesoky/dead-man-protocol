version: '3.8'
services:
  db:
    image: postgres:15.5-alpine
    restart: always
    environment:
      POSTGRES_USER: dmb_admin
      POSTGRES_PASSWORD: dmb_quantum_password123
      POSTGRES_DB: quantum_vault
    ports:
      - '5440:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
